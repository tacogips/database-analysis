[tools]
ruby = "4.0.9"

[tasks.all]
description = "Rebuild from nothing and run the selected essential nonlocking scope"
run = "mise exec -- ruby lab.rb all"

[tasks.prepare]
description = "Reset, load and verify data"
run = "mise exec -- ruby lab.rb prepare"

[tasks.measure]
description = "Run the selected essential nonlocking scope on loaded data"
run = "mise exec -- ruby lab.rb measure"

[tasks.experiment]
description = "Re-run named experiments without reloading data"
run = "mise exec -- ruby lab.rb experiment"

[tasks.reset]
description = "Delete this project's containers, .data and results"
run = "mise exec -- ruby lab.rb reset"
