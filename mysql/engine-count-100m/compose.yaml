# This file is an input to lab.rb, never an independent service lifecycle.
services:
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: lab-mysql-engine-count-100m
    user: "${EC_UID:?controller required}:${EC_GID:?controller required}"
    network_mode: none
    restart: "no"
    mem_limit: 4g
    cpus: 3.0
    stop_grace_period: 25s
    labels:
      count.engine100m.owner: "${EC_OWNER:?controller required}"
    environment:
      MYSQL_ROOT_PASSWORD: public-disposable-engine100m
    volumes:
      - type: bind
        source: "${EC_STAGE:?controller required}"
        target: /labdata
        bind:
          create_host_path: false
    # Override the image's unused VOLUME to prevent anonymous Docker data volumes.
    tmpfs:
      - /var/lib/mysql:size=1048576,mode=0700
    command:
      - mysqld
      - --datadir=/labdata/data
      - --tmpdir=/labdata/tmp
      - --socket=/labdata/mysql.sock
      - --pid-file=/labdata/mysql.pid
      - --secure-file-priv=NULL
      - --skip-networking
      - --mysqlx=OFF
      - --skip-log-bin
      - --innodb-buffer-pool-size=1073741824
      - --key-buffer-size=134217728
      - --innodb-redo-log-capacity=1073741824
