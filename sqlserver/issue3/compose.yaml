name: lab-sqlserver-issue3
services:
  server:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
    platform: linux/amd64
    container_name: lab-sqlserver-issue3
    labels:
      count.issue3.owner: "${ISSUE3_OWNER:?controller only}"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: CountIssue3_Lab_Only_2026!
      MSSQL_MEMORY_LIMIT_MB: "3072"
    mem_limit: 4g
    cpus: 2
    volumes:
      - data:/var/opt/mssql
    networks: [runtime]
  client:
    image: "lab-sqlserver-issue3-client:${ISSUE3_OWNER:?controller only}"
    container_name: lab-sqlserver-issue3-client
    labels:
      count.issue3.owner: "${ISSUE3_OWNER:?controller only}"
    mem_limit: 2g
    cpus: 2
    networks: [runtime]
networks:
  runtime:
    name: lab-sqlserver-issue3-network
    internal: true
    labels:
      count.issue3.owner: "${ISSUE3_OWNER:?controller only}"
volumes:
  data:
    name: lab-sqlserver-issue3-data
    labels:
      count.issue3.owner: "${ISSUE3_OWNER:?controller only}"
